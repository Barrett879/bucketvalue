# Light is the shipped default (theme.py THEME_DEFAULT_DARK = False). Keeping
# base="light" here matters: it is what any iframe-rendered component inherits
# before our own tokens apply, so a mismatch shows as a dark flash on load.
[theme]
base = "light"
primaryColor = "#16d4c1"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#14142a"

[server]
headless = true
# The two self-hosted webfonts in bucketlib/theme.py are served from
# /app/static/fonts/. Streamlit does NOT serve static/ unless this is on, and
# with it off the request does not 404: it returns 200 with the SPA's own
# index.html (6602 bytes of text/html), so the @font-face silently fails and
# every visitor falls back to a system font. The files are on disk beside
# app.py, which is where Streamlit expects them, so the flag is all that was
# missing.
enableStaticServing = true
# The largest websocket message, in MB (Streamlit's default is 200). A full
# PrizePicks slate pasted pretty-printed is ~11.5M characters (~6,000 lines),
# so 24 fits ~12,000 lines; props.MAX_PASTE_CHARS sits just under it so an
# oversized paste gets the panel's own message, not a dropped connection.
# The board keeper (props_ui) puts a JSON-valued widget on every page, which
# Streamlit parses and copies before any app code runs: a hostile '[],[],...'
# message costs ~43 bytes of memory per character, so the 200 MB default
# would let one message exhaust the host (review 2026-11-05).
maxMessageSize = 24

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# "type" on the shared deployment: the exception type and a generic message,
# never a traceback. On Streamlit 1.59 the old boolean `false` maps to
# "stacktrace", which STILL prints tracebacks with absolute server paths (seen
# in this repo's own preview, 2026-10-08), so the sibling sites' `false` does
# not do what their comment says. Run locally with
# `--client.showErrorDetails=full` when debugging.
showErrorDetails = "type"
