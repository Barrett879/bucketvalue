# The bot: scripts/daily_update.py refreshes state/ (schedule, rosters, final
# box scores, the injury report, pregame odds) and publishes projections, then
# commits ONLY state/. docs/serving_design.md section 4.
#
# FULL SCHEDULE, on since 2026-11-04, when the repo went public (Barrett's
# call): dense off-minute crons (:17 and :47, 13:00-06:47 UTC = 8 AM to 1:47 AM
# EST, 9 AM to 2:47 AM EDT), 36 slots a day. Public runs cost no Actions
# minutes. The cadence logic lives in Python, which derives the ET date every
# run; cron starts run hours late and GitHub skips some (2026-11-02..04, on the
# private schedule: 5 runs from about 10 slots), which is why the slots are
# dense. A game freezes on the last run before its tip minus 5 minutes.
#
# PRIVATE-REPO SCHEDULE, 2026-11-02..04 and the rollback (docs/runbook.md
# section 6): four runs a day, "17 2,15,20,23 * * *", inside a private repo's
# free 2,000 minutes a month. 36 runs a day of 6-10 minutes would spend those
# within a week, so swap it back in the same change as any return to private.
# The go-live order and checks: docs/runbook.md.
#
# Runs that never start send no failure email: the last step pings a
# dead-man's switch (the BV_HEALTHCHECK_URL secret, healthchecks.io style),
# which alerts when the pings stop. The offseason keepalive lives in
# scripts/commit_state.sh (a dated state/keepalive.txt commit once the newest
# commit is 45 days old: scheduled workflows of a public repo are disabled
# after 60 days without activity).
name: daily-update
on:
  workflow_dispatch:
    inputs:
      date:
        description: "PAST ET date to replay as today (YYYY-MM-DD). Leave EMPTY for live runs: a future date is refused, and a plain run projects tomorrow anyway"
        required: false
        default: ""
  schedule:
    # Full schedule (the repo is public; see the header):
    - cron: "17,47 13-23 * * *"
    - cron: "17,47 0-6 * * *"
    # Private-repo schedule, only if the repo goes private again (replaces both):
    # - cron: "17 2,15,20,23 * * *"
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      # The branch TIP when the job starts, not the commit the run was created
      # on: a run that queued behind another one (concurrency below) would
      # otherwise compute on a base without that run's push, and its state
      # files would conflict on the rebase.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Python version from runtime.txt
        id: py
        run: echo "version=$(sed -e 's/^python-//' runtime.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests (the local-cache tests skip here)
        run: python -m pytest -q
      - name: Bot
        id: bot
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            python scripts/daily_update.py --date "$DATE_INPUT"
          else
            python scripts/daily_update.py
          fi
        # A RED run still commits what it did write (stale beats empty), then
        # the job fails at the end.
        continue-on-error: true
      - name: App smoke render (AppTest) on the new state
        run: python -m pytest -q tests/test_pages_smoke.py
      - name: Commit state/ only
        # scripts/commit_state.sh: the allow-list (anything changed outside
        # state/ fails the job), the offseason keepalive, and the push with
        # pull --rebase (a conflicting rebase is aborted and fails the job:
        # this run computed on a stale base; other failures are retried).
        run: bash scripts/commit_state.sh "${GITHUB_REF_NAME}"
      - name: Fail a RED run
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::the bot run was RED (see the Bot step)"
          exit 1
      - name: Dead-man's switch
        # Every run that gets this far pings the monitor (success, or /fail
        # for a RED or failed run); the monitor alerts when pings stop
        # arriving, which is the only signal a run that never starts gives.
        # Skipped (with a warning) until the secret is set: see the runbook.
        if: always()
        env:
          HC_URL: ${{ secrets.BV_HEALTHCHECK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::warning::BV_HEALTHCHECK_URL is not set: no dead-man's switch for this workflow"
            exit 0
          fi
          url="$HC_URL"
          if [ "$JOB_STATUS" != "success" ]; then url="$HC_URL/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url" || echo "::warning::the healthcheck ping failed"
