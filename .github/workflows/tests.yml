# The test suite on every push and pull request. The tests that need the
# local backfill (cache/, never committed) skip here; network tests are
# deselected by pytest.ini.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Python version from runtime.txt
        id: py
        run: echo "version=$(sed -e 's/^python-//' runtime.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
